[mod-name]
kry-asteroid-belt=更好的小行星带 [Better Asteroid Belt]

[mod-description]
kry-asteroid-belt=从头做起的小行星带（Asteroid Belt）再实现，动态性更强。

[mod-setting-name]
kry-asteroid-belt-density=小行星带密度乘数
kry-asteroid-belt-name=第一小行星带名称
kry-kuiper-belt=第二小行星带设置
kry-kuiper-belt-name=┣ 第二小行星带名称
kry-vesta-past-kuiper=┗ 灶神星移至第二小行星带外
kry-maraxsis-outer-planet=沧海星改为外行星
kry-maraxsis-solar-nerf=┗ 削弱沧海星上的太阳能
kry-cubium-outer-planet=立方星改为外行星
kry-cubium-vesta-moon=┗ 立方星改为灶神星卫星

[mod-setting-description]
kry-asteroid-belt-density=小行星带内星岩生成概率的乘数。最小值为0.0（无星岩），最大值为100.00（大量星岩）。
kry-kuiper-belt=启用位于玄冥星和星系边缘之间的第二小行星带，可以仅作星图装饰，也可以作为新增的太空位置。无论如何，都会相应移动天体避免遮挡。
kry-vesta-past-kuiper=将灶神星（Vesta）从外星系星域移动到第二小行星带外侧、星系边缘之前。仅在启用第二小行星带时生效。
kry-maraxsis-outer-planet=将沧海星（Maraxsis）从内星系移动至外星系，和它与玄冥星相仿的难度匹配。
kry-maraxsis-solar-nerf=将沧海星上的太阳能从75%削弱至50%，以匹配它在玄冥星旁的新位置（作为对比，玄冥星的太阳能为1%），与其难度或实际位置符合。\n此设置需要启用“沧海星改为外行星”。
kry-cubium-outer-planet=将立方星（Cubium）从内星系移动至外星系，以作平衡处理。
kry-cubium-vesta-moon=将立方星改为灶神星（Vesta）的卫星。若星际投物炮（Orbital Catapult）已启用，则会使用投物炮路线而非直接航线连接两者。

[string-mod-setting-description]
kry-asteroid-belt-name-Kepler=取自有记录第一位提出太阳系中火星与木星之间存在小行星带的科学家。
kry-kuiper-belt-name-Kuiper=取自第一位提出海王星轨道外存在内有大量冰质天体区域的科学家。
kry-asteroid-belt-name-Klothon=取自希腊神话命运三女神之一；纺者，纺织生命之线的神。
kry-kuiper-belt-name-Atropon=取自希腊神话命运三女神之一；必然与不可避免者，切断生命之线的神。
kry-asteroid-belt-name-Kovarex=取自《异星工厂》项目的发起人。大概还有个核处理过程也以他为名。
kry-kuiper-belt-name-Kryzeth=你怎么会想用这个选项？如果你真想知道的话，取自本模组的作者。

