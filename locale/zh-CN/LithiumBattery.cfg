[technology-description]
lithium-accumulator=锂蓄电器，蓄电量和输入输出速率都更高。
lithium-battery-mk4=锂电池可用于制造电池组模块 MK4。
lithium-roboport-mk3=能支持更多机器人充电，充电速度也更快的机器人指令平台。建造区域相对普通指令平台较大。
lithium-shield-mk3=能量盾模块 MK3能吸收更多伤害。
hea-processing=研究高熵合金，产出一种强度极高的新金属。
hea-engine=跻身尖端科技行列的先进电动机。对热和压力的耐受度极高，输出的功率也相当可观。
automation-4=最新一代的组装机，制造速度进一步加快。
hea-thruster=解锁强大高熵合金推进器。这台猛兽的推进力是基础推进器的4倍，但燃料消耗量是其10倍。

