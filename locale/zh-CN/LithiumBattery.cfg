[mod-name]
LithiumBattery=玄冥星大修：锂电池

[mod-description]
LithiumBattery=高度可自定义的大修。向科技包新增锂电池，并为终局添加了全新的生产链。解锁强大的物品和全新等级的个人设备模块。

[mod-setting-name]
lithium-battery-fusion-generator=修改聚变发电机配方
lithium-battery-fusion-reactor-equipment=修改聚变反应堆模块配方
lithium-battery-railgun=修改磁轨炮配方
lithium-battery-railgun-turret=修改磁轨炮塔配方
lithium-accumulator=添加锂蓄电器
lithium-accumulator-tech-cost=锂蓄电器科技的花费
lithium-accumulator-buffer=锂蓄电器的蓄电量（MJ）
lithium-accumulator-flow=锂蓄电器的输入输出速率（kW）
lithium-accumulator-quality=品质等级下蓄电器蓄电量的百分比增量
lithium-battery-mk4=添加电池组模块 MK4
lithium-battery-mk4-capacity=电池组模块 MK4的蓄电量（GJ）
lithium-battery-mk4-tech-cost=电池组模块 MK4科技的花费
lithium-roboport-mk3=添加机器人指令模块 MK3
lithium-roboport-mk3-robots-number=机器人数量上限
lithium-roboport-mk3-radius=建设范围半径
lithium-roboport-mk3-flow=机器人充电速度（MW）
lithium-roboport-mk3-stations-number=充电位数量
lithium-roboport-mk3-tech-cost=机器人指令模块 MK3科技的花费
lithium-shield-mk3=添加能量盾模块 MK3
lithium-shield-mk3-hitpoint=能量盾模块 MK3的防护值
lithium-shield-mk3-tech-cost=能量盾模块 MK3科技的花费
hea-endgame=启用终局高熵合金大修（这是模组的核心部分）
hea-promethium=修改钷素科技包配方
hea-processing-tech-cost=高熵合金加工科技的花费
hea-engine-tech-cost=高熵合金电动机科技的花费
hea-assembling-machine-4=添加组装机4型
hea-assembling-machine-4-speed=组装机4型的制造速度
hea-assembling-machine-4-energy=组装机4型的能耗（MW）
hea-assembling-machine-4-tech-cost=自动化 4科技的花费
hea-thruster=添加高熵合金推进器
hea-thruster-tech-cost=高熵合金推进器科技的花费
lithium-battery-compat-electric-heating-tower=修改电力供热塔
lithium-battery-compat-electric-heating-tower-tech-cost=电力供热塔花费
hea-belt=添加特快传送带
hea-belt-speed=特快传送带的运载速度
hea-belt-tech-cost=特快传送带科技的花费


[mod-setting-description]
lithium-battery-fusion-generator=仅禁用“终局高熵合金”时有效，启用时配方会自动调整。会向基础配方加入锂电池。
lithium-battery-fusion-reactor-equipment=仅禁用“终局高熵合金”时有效，启用时配方会自动调整。会向基础配方加入锂电池。
lithium-battery-railgun=仅禁用“终局高熵合金”时有效，启用时配方会自动调整。会向基础配方加入锂电池
lithium-battery-railgun-turret=仅禁用“终局高熵合金”时有效，启用时配方会自动调整。会向基础配方加入锂电池。
lithium-accumulator-quality=适用于蓄电器和锂蓄电器。仅启用“锂蓄电器”时有效
lithium-roboport-mk3-radius=半径为25对应50x50的区域
hea-endgame=添加高熵合金，包含新生产链、配方变化、科技重排。会让游戏变得更难。
hea-promethium=将量子处理器替换为高熵合金电动机
hea-assembling-machine-4=仅启用“终局高熵合金”时有效
hea-thruster=仅启用“终局高熵合金”时有效
hea-belt=仅启用“终局高熵合金”时有效。如需在禁用时使用，可下载“PromethiumBeltRebalance”模组
hea-belt-speed=仅启用“终局高熵合金”时有效。
hea-belt-tech-cost=仅启用“终局高熵合金”时有效。如需在禁用时使用，可下载“PromethiumBeltRebalance”模组，科技花费在该模组中设置

