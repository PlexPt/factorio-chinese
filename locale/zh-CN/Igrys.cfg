[space-location-description]
igrys=明舛星（Igrys）：一颗被[item=stone]覆盖的贫瘠星球，在这里科学与魔能相遇。它的大气层能够使[item=copper-plate]自然形成，而地下的[fluid=igrys-magic-fluid]则为先进的工业提供动力。它也是少有的无法获取[item=iron-ore]的星球。

