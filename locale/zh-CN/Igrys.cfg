[mod-setting-description]
igrys-enhance-modded-science-packs=启用可丰富游戏体验。尝试让科学增幅器与模组添加的科技包兼容。可能会与其他模组产生问题，小心使用。

[item-description]
igrys-science-enhancer-machine=更高效地制造科技包，但运作需要[fluid=igrys-magic-fluid]。
igrys-glass-space-rocket=玻璃火箭发射所需的组件更少，但制造需要[item=igrys-glass]。
igrys-copper-plate-machine=拜[planet=igrys]的大气组成所赐，此机器能凭空制造[item=copper-plate]，但只能在夜间运作。
igrys-magic-pumpjack=需要[fluid=water]，但生产效率更高，并且能够提取[fluid=igrys-magic-fluid]。

