[mod-name]
AsteroidBelt=小行星带 [Asteroid Belt]

[mod-description]
AsteroidBelt=新增小行星带，将行星系的各行星分为内行星和外行星。内行星有新地星、祝融星、雷神星、句芒星（模组：勾陈星、荆岚星、灼原星、明舛星、硫丹星）。外行星有玄冥星（模组：沧海星、特暗星、立方星、御宿星与寂蛰星、北冥星）。小行星带的边缘有大量资源。穿越小行星带的旅程较短，但很难走；你需要进攻和防御并重的飞船，或是能调整自身速度的飞船。

[technology-name]
space-discovery-asteroid-belt=发现星域：小行星带

[technology-description]
space-discovery-asteroid-belt=解锁前往小行星带的航行能力，该区域分隔了内行星与外行星

[space-location-name]
asteroid-belt-inner-edge=小行星带 - 内缘
asteroid-belt-outer-edge=小行星带 - 外缘

[space-location-description]
asteroid-belt-inner-edge=小行星带的内侧边缘
asteroid-belt-outer-edge=小行星带的外侧边缘

[mod-setting-name]
density-multiplier=小行星带密度乘数

[mod-setting-description]
density-multiplier=小行星带内星岩生成概率的乘数。最小值为0.0（无星岩），最大值为100.00（大量星岩）。