[technology-description]
panglia_planet_discovery_panglia=盘灵星（Panglia）：句芒星的卫星，繁茂而葱郁；星球上有蕴含能量的植物、奇异的自复制材料，还有些时间流动不甚自然的地区。
panglia_branbalite_slurry=自胶灵树叶提取得到的、极具营养的树液。
panglia_branbalite_slurry_to_crudeoil=将胶灵材料转化为原油。
panglia_panglite_multiplication=盘灵石是一种异星合金，加热后可无限增殖。
panglia_panglite_fiber=因其在高温下的自愈性而极其耐用的多功能材料。
panglia_panglite_glass=将盘灵石和玻璃结合制成薄层，借此在微观尺度上偏转激光。
panglia_advanced_optics_nanotech=使用盘灵石制造能在分子层面上定位和操纵元素的机器，可用它处理基因组。
panglia_collect_dna_fish=
panglia_collect_dna_biter=
panglia_collect_dna_demolisher=
panglia_collect_dna_pentapod=
panglia_dna_unfolding=在操控DNA之前，需要先将其映射为区分出各部分功能的可计算形态。
panglia_dna_manipulation=通过重组基因创造全新品种的生命。
panglia_dna_manipulation_testing=模拟室可存放生物体，使其在成熟前保持相对停滞，直至确认其DNA可存活。
panglia_dna_manipulation_phasetwo_tech=在确认生物体模板可存活之后，其DNA即能在胚胎锻造厂中用作复制的蓝本。
panglia_simulation_chamber=创造完全虚拟的现实，将生物体连接至其中，让它体验虚构的一生。
panglia_simulation_matrix=生物工程所得的标本成熟后，就可以分离出其脑部，评估它的智能。
panglia_sentient_processor=将意识上传至计算机。生物与人工智能结合，或许就有了最完美的数据处理能力。

panglia_worker-robots-speed=完全革新内部电路，让作业机器人更加迅速。
panglia_worker-robots-storage=拿取与运输物品更智能的方式。可让作业机器人装下更多物品。
panglia_crusher=将任意材料破碎为极细的复合粉末。
panglia_igneous_rock_to_lava=将火成岩熔融为岩浆。
panglia_tech_timewarp_data=在时间异常区域收集[font=moshine-data][color=#d699ff]time_flow.data[/color][/font]，借此理解操控时间流动的方式。
panglia_tech_timewarp_data_nocolor=在时间异常区域收集time_flow.data，借此理解操控时间流动的方式。


