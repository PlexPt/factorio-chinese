[mod-name]
supercooled-solar=过冷太阳能 [Supercooled solar]

[mod-description]
supercooled-solar=在寒冷星球上增加Sacredanarchy的太阳能矩阵和蓄电器的效率。

[mod-setting-name]
supercooled-solar=启用寒冷太阳能矩阵
supercooled-accumulator=启用寒冷蓄电器V2
supercooled-accumulator-multiplier=蓄电器V2寒冷乘数
supercooled-solar-multiplier=太阳能矩阵寒冷乘数

[mod-setting-description]
supercooled-solar=为太阳能矩阵启用寒冷环境增益。移除本模组前务必禁用此项！
supercooled-accumulator=为蓄电器V2启用寒冷环境增益。移除本模组前务必禁用此项！
supercooled-accumulator-multiplier=蓄电器V2的输入/输出和蓄电量在寒冷星球上的倍率
supercooled-solar-multiplier=太阳能矩阵的电力产速在寒冷星球上的倍率