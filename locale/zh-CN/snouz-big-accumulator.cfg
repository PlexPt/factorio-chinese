[mod-name]
snouz-big-accumulator=大型蓄电器 [Big accumulator]

[mod-description]
snouz-big-accumulator=这个模组增加了一个可配置的4x4蓄电器，蓄电量为普通蓄电器的24倍（即6倍空间利用率）。

[technology-name]
electric-energy-big-accumulators-1=蓄电器小型化技术
[technology-description]
electric-energy-big-accumulators=这些超高效的蓄电器可以存储普通蓄电器24倍的电力，同时只占用4倍的空间。

[entity-name]
big-accumulator=大型蓄电器

[item-name]
big-accumulator=大型蓄电器

[mod-setting-name]
big-accumulator-multiplier-percent=大型蓄电器乘数（%）

[mod-setting-description]
big-accumulator-multiplier-percent=大型蓄电器的蓄电量-占地面积比相对普通蓄电器的倍数（%）。\n默认：600，旧版本值：1500，需在100和4000之间。