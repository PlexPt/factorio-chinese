[tips-and-tricks-item-name]
apia-briefing=蜂凝星导览
carnova-briefing=肉络星导览

[tips-and-tricks-item-description]
apia-briefing=[planet=apia]（Apia），[planet=apia]-[planet=carnova]双行星系统中的一颗星球，具有浓密的大气，[entity=logistic-robot]和[entity=construction-robot]的消耗也因此上升。浓厚的云层降低了[entity=solar-panel]的效率。\n星球表面有着广阔的[fluid=royal-jelly]海，其中寄宿着[entity=larvae]。这些生物的硬化遗骸能产出各类基础资源：[item=iron-ore]、[item=copper-ore]、[item=stone]。\n星球上还有能产蜜的昆虫，也是它们建造了[entity=wild-hive]。它们产出的[item=honeycombs]可加工为[item=honey]和[item=wax]。\n这里的全新重要资源是[item=phosphorus]和[fluid=phosphoric-acid]。
carnova-briefing=[planet=carnova]（Carnova），[planet=apia]-[planet=carnova]双行星系统中的一颗星球。星球的表面覆盖着[fluid=blood]的海洋，海中常会出现当地动物群——[entity=piranha]——的巢穴。\n基础资源的主要来源是[item=bones]，其中富含矿物质和钙。可制造的基础资源有：[item=iron-ore]、[item=copper-ore]、[item=stone]、[item=phosphorus]、[item=calcite]。\n星球表面还有无数[item=flesh]质岛屿，可用其加工得到[item=proteins]和[item=lipids]。这里的替代工业用酸是[fluid=phosphoric-acid]。
