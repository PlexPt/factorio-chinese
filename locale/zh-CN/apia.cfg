[space-location-description]
apia=蜂凝星（Apia）：双行星系统中的一颗星球，具有浓密黏稠的大气。星球的表面是一片富含营养的蜂王浆海——由当地蜜蜂生产而来，其中散落着许多小岛。星球的代表动物群是产蜜昆虫和无脊椎幼虫的共生系统。
carnova=肉络星（Carnova）：双行星系统中质量较大的那一颗，大气中富含氧。星球表面被一片海洋覆盖，其中液体的组成与血液非常相似。海洋中点缀着无数肉质岛屿，岛屿上又有骨质矿床。星球的代表动物群是生活在血海之中的掠食性鱼类。
apia-carnova-orbit=双行星系统的绕转中心。


