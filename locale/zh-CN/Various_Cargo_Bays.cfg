[mod-name]
Various_Cargo_Bays=多种接驳扩展仓 [Various Cargo Bays]

[mod-description]
Various_Cargo_Bays=新增了两种接驳扩展仓，均与原版内容配合良好且各有专长！

[item-name]
hatch-cargo-bay=接驳接口仓
storage-cargo-bay=接驳储存仓
logistics-cargo-bay=接驳物流仓
[item-description]
hatch-cargo-bay=小幅增加太空平台枢纽和物流接驳站的储存容量，且拥有两个输入/输出口。
storage-cargo-bay=大幅增加太空平台枢纽和物流接驳站的储存容量，但没有输入/输出口。
logistics-cargo-bay=基本不提供储存容量和输入/输出口，但可与机械臂交互。
