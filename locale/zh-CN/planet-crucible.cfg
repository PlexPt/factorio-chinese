[string-mod-setting-description]
planet-crucible-vanilla-change-amount-all=向玄冥星的大多数配方添加坩埚星的特色产物。这也是本模组设计中的游玩方法，单独添加时尤其如此；在添加多个星球时可能不能完全融入整体的游玩流程。
planet-crucible-vanilla-change-amount-no-recipes=向大多数需要所有其他内行星科技包的科技添加高压科技包。
planet-crucible-vanilla-change-amount-no-technologies=仅向钷素科技包和科研增产计划添加高压科技包。
planet-crucible-vanilla-change-amount-none=不改动已有的配方和科技。

