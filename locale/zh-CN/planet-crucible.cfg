[technology-description]
planet-discovery-crucible=坩埚星（Crucible）：一颗庞大致密的岩石星球，重力和气压极大。受强大重力的影响，在[space-location=crucible]上发射火箭需要熟练使用星球上的资源。这里处处有良机……前提是你能承受住压力。
planet-crucible-kiln=直接由热量驱动的庞大熔炉。除去常规的熔炼之外，它还能接受流体输入，这也是处理[item=planet-crucible-skarn]的关键。
planet-crucible-emulsion-processing=可将[fluid=planet-crucible-emulsion]处理为有用的流体，偶尔还能获得几枚[item=planet-crucible-diamond]。
planet-crucible-skarn-processing-adv=释放出[item=planet-crucible-skarn]的全部潜力。
planet-crucible-pressure-forge=用于高压工艺的制造设备。
planet-crucible-hydrogen-processing=经高压处理的氢有许多有用的性质，但不妥善使用便难以控制。
planet-crucible-hydrogen-metallization=制造金属氢——高压科学的明珠。
planet-crucible-science-pack=更先进的高压应用。
planet-crucible-rocket-part=制造能抵达[space-location=crucible]轨道的火箭。
planet-crucible-gem-synthesis=[item=planet-crucible-ruby]和[item=planet-crucible-diamond]的高效配方。
planet-crucible-thruster=金属氢可让逃脱[space-location=crucible]的强大重力井变得不再艰难。
planet-crucible-military=金属氢可让你在太空中不依托星岩制造弹药。
planet-crucible-lithium-hydride=金属化氢的高效配方。
planet-crucible-night-vision-mk2=更紧凑的[item=night-vision-equipment]。
planet-crucible-personal-laser-mk2=更强大的[item=personal-laser-defense-equipment]。
planet-crucible-offshore-pump=升级版[entity=offshore-pump]，能在[space-location=crucible]强大的重力中运作。
planet-crucible-optics=用于聚焦可控制光的先进工具。
planet-crucible-laser=需要透镜来聚焦巨量能量的先进激光武器。
planet-crucible-lens-one=适用于[entity=planet-crucible-laser-turret]的聚焦透镜，能造成撞击伤害。
planet-crucible-lens-two=适用于[entity=planet-crucible-laser-turret]的聚焦透镜，能造成酸蚀伤害。
planet-crucible-lens-three=适用于[entity=planet-crucible-laser-turret]的聚焦透镜，能造成火焰伤害。
planet-crucible-lens-four=适用于[entity=planet-crucible-laser-turret]的聚焦透镜，能造成电击伤害。
planet-crucible-lens-five=适用于[entity=planet-crucible-laser-turret]的聚焦透镜，能造成毒素伤害。

