[tips-and-tricks-item-description]
planet-crucible-briefing=[planet=crucible]（Crucible），一颗致密的星球，不含[entity=iron-ore]、[entity=copper-ore]、[entity=uranium-ore]、[entity=stone]、[fluid=water]或[entity=crude-oil]，不过所有必需物品均可由[entity=planet-crucible-skarn]和[entity=planet-crucible-emulsion]制得。\n[entity=solar-panel]的效率更高。这里环境恶劣，但没有自然危害。\n[tile=planet-crucible-lava]要到之后才可泵取，而且直到很久之后才能填平，但可以通过高架铁路穿越。
planet-crucible-gravity=[img=utility/warning_icon][font=default-bold]警告[/font][img=utility/warning_icon] 受[planet=crucible]极端重力和气压的影响，常规的[item=rocket-fuel]不足以将火箭发向太空。\n降落到[planet=crucible]后，你需要用[item=planet-crucible-science-pack]研究出离开星球的方法。
planet-crucible-metallic-hydrogen=[tooltip=金属氢,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-enum]的能量密度较高且稳定性较低，极为危险，在生产制造中使用时应做好预防措施。\n所有形态的[tooltip=金属氢,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-enum]都会在被摧毁时爆炸，且无法直接回收，仅可在[entity=planet-crucible-pressure-forge]中安全再处理。在太空中也可投入虚空以销毁。\n若不加妥善处理，[tooltip=最不稳定,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-unstable-enum]的金属氢会在短时间内自行爆炸，也因此这类物品无法大量囤积。
planet-crucible-metallic-hydrogen-enum=金属氢：\n[item=planet-crucible-denatured-hydrogen] 变性氢\n[item=planet-crucible-denatured-hydrogen-critical] 变性氢（危急）\n[item=planet-crucible-hydrogen-plate] 氢板（稳定）\n[item=planet-crucible-hydrogen-plate-activated] 氢板（激活）\n[item=planet-crucible-hydrogen-plate-unstable] 氢板（不稳定）\n[item=planet-crucible-hydrogen-plate-critical] 氢板（危急）\n[item=planet-crucible-lithium-hydride] 氢化锂\n[item=planet-crucible-hydrogen-cable] 氢丝
planet-crucible-metallic-hydrogen-unstable-enum=最不稳定的金属氢：\n[item=planet-crucible-denatured-hydrogen] 变性氢\n[item=planet-crucible-denatured-hydrogen-critical] 变性氢（危急）\n[item=planet-crucible-hydrogen-plate-activated] 氢板（激活）\n[item=planet-crucible-hydrogen-plate-unstable] 氢板（不稳定）\n[item=planet-crucible-hydrogen-plate-critical] 氢板（危急）
planet-crucible-space-platform=[img=utility/warning_icon][font=default-bold]警告[/font][img=utility/warning_icon] 受[planet=crucible]极端引力的影响，太空平台需要极强的推力才能抵达[space-location=crucible-orbit]。仅推荐在能将速度维持于远超__1__ km/s时尝试航行。\n[planet=crucible]附近的星岩极少，你可能需要通过[item=planet-crucible-science-pack]研究在太空中获取必要资源的其他方法。
