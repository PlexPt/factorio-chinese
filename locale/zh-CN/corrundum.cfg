petroleum-tile=石油气地格

[mod-setting-description]
automatically-populate-pressure-lab=若为true，data.raw["lab"]["pressure-lab"].inputs等于data.raw['lab']['lab'].inputs
automatically-populate-labs-with-electrochemical-science=是否遍历所有研究中心，向它们的输入槽添加硫电科技包。
ignore-everything-brute-force-science-into-pressure-lab=在data-updates结束时，清除高压研究中心的输入，再向其添加科技包子分组下的所有科技包。此操作会导致原本只应在特定研究中心中使用的科技包外泄，但也同时能保证兼容性。没有研究中心接受所有科技包的报错确实很棘手。
require-vulcanus-before-corrundum=若为true，硫丹星的解锁即需要冶金科技包。
force-reduction-requires-plates=若为true，配方force-reduction-iron和force-reduction-copper会分别需要铁板和铜板作为原料，并各额外产出一份矿石。修改配方是因为我觉得原本的太容易产出传说物品了，而且我没法限制你只使用基础品质的物品。传说铁板可通过硫酸盐溶液路线产出3份传说铁矿……
maraxsis-bonus-content=若为true且安装有沧海星（Maraxsis），新增1项新科技和2个新配方。
consider-planetslib=若为true且安装有PlanetsLib，则本模组不进行研究中心输入的设置，也不向所有研究中心添加硫电科技包。如希望让PlanetsLib处理科技包兼容性，可以启用此项。

