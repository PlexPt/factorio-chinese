[recipe-description]
electrochemical-science-pack=硫、铂与硫酸制成！
platinum-plate=在铸造厂中制造的铂板！
platinum-plate-production-alt=在熔炉中制造的铂板！
catalytic-chemical-plant=建造使用铂催化剂的专用化工厂。
pressurized-acid-neutralization=硫丹星的高压环境可从此酸中和中提取更多能量。
pressurized-acid-neutralization-alt=需要更多水来捕获释放的能量，不过这是良好的开端。
dilute-acid-neutralization=中和反应释放的热能足以煮沸水。
hot-water-to-steam=再推一把，将热水转化为500度蒸汽。
petroleum-alkylation=大量的硫酸可辅助形成碳正离子，这也是烷基化中形成碳碳键的基础。
light-oil-alkylation=大量的硫酸可辅助形成碳正离子，这也是烷基化中形成碳碳键的基础。这种反应形式可制备重油。
sulfur-combustion=燃烧硫可产出这种气体，它也是硫酸和水的原料。
hydrogen-sulfide=铂催化下，可以用石油气向硫加氢得到硫化氢。
sulfur-reduction=硫还原至零价，同时形成水。
sulfurous-oxidation=铂催化下，二氧化硫可直接与氧气反应形成三氧化硫。三氧化硫再与水反应即可得到硫酸。
hydrogen-sulfide-combustion=燃烧硫化氢可得到制备硫酸所需的原料。
chalcopyrite-refining=在高温环境下配合浓缩硫酸烧炼黄铜矿（FeCuS₂），可完全氧化其中的金属，形成两者混合的硫酸盐溶液。
reactive-displacement=铁比铜活泼，因此可用铁从溶液中置换出铜。
force-reduction-iron=可利用电势差移动离子溶液中的电子。这些电子能将铁离子还原回纯铁。产品本身需要再加处理才可塑形为板状。
force-reduction-copper=和硫酸铁的还原类似，电子也可用于还原铜离子。
sulfonated-plastic=铂催化下，二氧化硫可和氧气生成三氧化硫。三氧化硫可与硫酸结合形成发烟硫酸，这种材料又可磺化碳氢化合物。
sulfonated-plastic-production-alt=铂催化下，二氧化硫可和氧气生成三氧化硫。三氧化硫可与硫酸结合形成发烟硫酸，这种材料又可磺化碳氢化合物。
calcium-sulfate-fish=在有氮源和磷源时，引入更多碳和硫酸钙可优化营养素的生产工艺。
calcium-sulfate-bioflux=在有氮源和磷源时，引入更多碳和硫酸钙可优化营养素的生产工艺。
calcium-sulfate-egg=在有氮源和磷源时，引入更多碳和硫酸钙可优化营养素的生产工艺。
calcium-sulfate=在有氮源和磷源时，引入更多碳和硫酸钙可优化营养素的生产工艺。
sulfuric-acid-dilution=注酸入水安全稀释，反着来就不好说了。
sulfuric-acid-concentration=花费大量能量将硫酸中的水蒸发得蒸汽，随后蒸汽可重新冷凝为水。
sulfuric-acid-concentration-alt=花费大量能量将硫酸中的水蒸发，随后便不再管。
calcium-sulfate-production-alt=二氧化硫和碳酸钙反应可生成硫酸钙和二氧化碳。
stone-production=石矿主要来自二氧化硅（反应物）和硅酸钙（产物）。和在祝融星上生产石矿类似。
asphalt-c=可将重油冷凝为混凝土前体。
asphalt-c-alt=也可用盈余的轻油制造沥青。这种反应速度较快，但效率较低。
concrete-production-from-asphalt=沥青和石矿可制造混凝土。
pressure-lab=将化工厂、研究中心、汽轮机组合为高压研究中心——只为科技！
thruster-fuel-oxidizer-to-steam=燃烧推进器燃料制造蒸汽！
carbon-dioxide-to-carbon=用铁将二氧化碳还原为碳。
iron-recrystalization=溶解不想要的材料，制备相应的硫酸盐溶液。
iron-recrystalization-alt=溶解不想要的材料，制备相应的硫酸盐溶液。
copper-recrystalization=溶解不想要的材料，制备相应的硫酸盐溶液。
copper-recrystalization-alt=溶解不想要的材料，制备相应的硫酸盐溶液。
platinum-thruster=速度即真理。
iron-stick-recrystalization=溶解不想要的材料，制备相应的硫酸盐溶液。
controlled-petrol-combustion=精密控制石油气燃烧，制备二氧化碳气体。
calcium-sulfate-recovery=通过多次清洗去除非极性分子，以从营养素中回收硫酸钙。
destructive-dilute-acid-neutralization=加热并蒸干水。
rocket-fuel-catalytic-chemistry=配方一致——只是可用于更快的机器！
super-saturated-displacement=重复多次过饱和和重结晶，即可从混合溶液中提取出更多的铜。
super-saturated-displacement-iron=适用于铁的过饱和置换。
sulfur-poison-capsule=升级版化学武器。
blue-rocket=更易爆的火箭弹，内填有更强大的新型爆炸物。
sulfuric-oxidizer=磺化碳氢化合物，向其引入大量含氧基团——产品可用作爆炸性反应的氧化剂。
explosives-from-sulfuric-oxidizer=将硫酸氧化剂封装成炸药包。
petrol-dehydrogenation-and-combustion=铂催化下，可以为碳氢化合物脱氢制得炔烃、烯烃和氢气。此反应吸热且需要高压环境，也因此很耗时。脱氢后完全燃烧不饱和烃，即可得到二氧化碳。
petrol-dehydrogenation-and-combustion-maraxsis=氧气由我们来生产！
kinetic-reactive-displacement=通过更多铁加快铜置换反应的速度。

