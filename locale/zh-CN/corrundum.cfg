[space-location-name]
corrundum=硫丹星

[space-location-description]
corrundum=硫丹星（Corrundum）：被稠密二氧化碳包裹的行星，大气中的氧气含量仍支持燃烧。正因此，这里的气压和温度都很高。失控的温室效应造就了比祝融星还要极端的环境，以至于地层和雷暴之中完全找不到生命的痕迹。高压环境让平常易挥发的石油气变成了液体——而且量不少。铁和铜多数一同锁在了黄铜矿之中。这里的特色金属是铂，它是高等硫处理所用的催化剂，也可充当电化学工艺所需的阴极与阳极。若想精通这颗星球，就必须学会一整套围绕硫展开的独特生产链路。

