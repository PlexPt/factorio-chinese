[technology-description]
planet-discovery-corrundum=硫丹星（Corrundum）：被稠密二氧化碳包裹的行星，大气中的氧气含量仍支持燃烧。正因此，这里的气压和温度都很高。失控的温室效应造就了比祝融星还要极端的环境，以至于地层和雷暴之中完全找不到生命的痕迹。高压环境让平常易挥发的石油气变成了液体——而且量不少。铁和铜多数一同锁在了黄铜矿之中。这里的特色金属是铂，它是高等硫处理所用的催化剂，也可充当电化学工艺所需的阴极与阳极。若想精通这颗星球，就必须学会一整套围绕硫展开的独特生产链路。
platinum-processing=将铂矿精炼成锭。
catalytic-chemical-plant=制造使用铂为催化剂和电化学过程中阴极/阳极的化工厂。
electrochemical-science-pack=制造硫电科技包（硫瓶）。
sulfur-redox1=制造硫化氢。
sulfur-redox2=生产硫和硫化氢。
sulfur-redox3=使用二氧化硫和水制造硫酸。
sulfate-processing-1=将多余的硫化氢转化为二氧化硫。
sulfate-processing-2=将黄铜矿处理为可利用的材料。
sulfur-dilution-concentration=浓缩和稀释硫酸。
sulfonated-plastic=使用发烟硫酸和碳源制造塑料。
calcium-sulfate=制造硫酸钙。
calcium-sulfate-nutrients=制造更多营养素。
stone-production=制造石矿。
asphalt-and-concrete=沥青与混凝土。
pressure-lab=制造适合精良及以上等级科技包的快速研究中心。在已启动的这类研究中心内，基础品质科技包每0.75秒就会消耗一个。
space-steam-production=使用推进器燃料和推进器氧化剂进行受控燃烧，将水转化为蒸汽。
dry-ice=将二氧化碳冷却为固体：干冰。干冰可在冰箱中用于为生物结晶、虫卵、农业科技包（草瓶）保鲜，将它们锁定在50%变质程度。只在冰箱内有效。
recrystalization=将多余的金属板溶解为溶液，以便将它们重结晶为矿石。
platinum-thruster=制造能承受消耗巨量流体所带来热量的推进器。
calcium-sulfate-recovery=从多余的营养素中回收硫酸钙。在分液漏斗中以轻油为有机相，以水为水相。随着时间推移，营养素中的离子即会扩散至水相，而所有有机材料则汇集至油层。这之后，用硫酸让溶液快速析出硫酸钙，再用更多的水进行重结晶以提纯硫酸钙晶体。
rocket-fuel-catalysis-productivity=使用催化工厂增加火箭燃料的产量（轻油和固体燃料）。不会为其他生产火箭燃料的方法提供加成。
blue-rocket=使用硫酸向固体燃料附上大量硫酸根，以便用作火箭弹的小体积氧化剂。
chalcopyrite-processing=将黄铜矿处理为铁和铜。
sulfur-poison-capsule=高级撕咬虫毒气。
petrol-dehydrogenation-and-combustion=为碳氢化合物脱氢形成双键得到氢气，再燃烧产物得到二氧化碳。

