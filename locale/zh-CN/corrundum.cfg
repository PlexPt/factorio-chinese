[item-description]
platinum-ore=一种有助于催化反应的贵金属。
chalcopyrite-ore=含铜铁硫化物的蓝紫色矿物（FeCuS₂）。
platinum-plate=精炼为板材的铂矿。
asphalt-c=可制成混凝土的精炼焦油。
catalytic-chemical-plant=一种带有铂制元件的化工厂。非常适合催化反应和电化学。
pressure-lab=研究中心与化工厂的怪异结合体。这台机器在高压环境下制造而成，研究速度比普通的研究中心更快，且科技包消耗也仅为35%。它由蒸汽驱动/增压，机器内部的高压环境使研究进程得以加快。然而，它不太能接受基础品质的科技包——普通的科技包不太适合这种高压环境。Powered by Steam!
red-boiler=专用于将石油气转化为高温二氧化碳气体的锅炉。而由于逸散的气体不多，这类锅炉的污染也相应较少。
red-steam-engine=改版蒸汽机。利用热电效应生产电能。它会接受高温二氧化碳气体，并产出电能——只是污染非常严重。
ice-box=由塑料制成，能将易腐物品保鲜在50%！
dry-ice=冷却成固态的二氧化碳。
sulfur-poison-capsule=能将硫变为毒雾的剧毒胶囊。
sulfuric-oxidizer=添加了硫酸根的燃料，可用作爆炸性反应的氧化剂。

