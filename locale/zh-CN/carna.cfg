[technology-description]
planet-discovery-carna=康神星（Carna）：温度极低的星球，以至于机器无法满速运作。我们需要加热周围环境的方法。
carna-interm_1=康神星地表散落着各类残骸。解锁残骸的使用方法，同时解锁等离子体凝块的基础制造和使用方法。
molybdenum-processing=钼是这颗星球上唯一可挖掘的自然资源，就好像几乎所有的自然资源都被转化甚至嬗变成了这种材料，不禁让人疑惑它究竟是否是自然形成。大量开采这种资源非常重要——它可用于全自动生产钼核心，也因此是制造更先进机器的关键。
chunk-processing=将流体转变为凝块，有制造蒸汽等若干种用途。
carnalseiver=此机器能分离和重现我们熟悉的原子性质，相当于将康神星的残骸转化为铁、铜，甚至是少量钼。在获得大量生产这些资源的手段前，它能帮我们渡过难关。
carnalairprocessing=康神星的大气中富含水，但地表却没有水体。钼气泵能以康神星本地生产的钼核心为基础，将大气中的特定粒子分离出来，形成可用的气体资源。
geyser-power=康神星的地表上有不少会喷出气体的喷口。这些喷气有多种用途，例如制造蒸汽，以及在钼供热塔中燃烧产热。供热塔能加热环境，让机器满速运转，是我们对抗康神星恶劣环境的助力。
algite-processing=密晶是出现于康神星机器内部的矿物。这种稀有资源可在钼筛分机内通过特殊核心分离残骸制得，是制造强大机器的必需材料。
stromatolite-carnabreed=将句芒星铁层叠石和铜层叠石的特殊品种实体化，即可大批量培养这些神奇的金属细菌，以作矿石的替代来源。培养需要使用农业塔。层叠石的生长需要合适的土壤，然而康神星缺乏生命。于是，我们制造了康神生命胶囊作为回应：这些手雷投掷后会产生一片云雾，转化一定区域内的土壤，让它们适合植物生长。
carnal-oil2=使用康神能量制造石油产品的先进方法。
algite-assembler=极其快速的组装机，需要康神等离子体才能运作。它在康神星之外几乎无法使用，但也许还有更好的机器能在其他星球上运转。
carnal-science-pack=瓶装的康神知识之源。
slipstack-carnabreed=句芒星黏叠珊瑚的康神品种。这种植物极适合用于生产富营养水——不会变质的能量源——以供应高级生物室使用。它也是培养奇异葵的关键。
boompuff-carnabreed=康神星上没有煤炭，这种植物能产出等效产品，以供加工为碳。
feron-processing=使用特种核心加工康神残骸堆，可产出一种极为稀有的矿物——莹质。它能助我们解锁康神能量，也可用于制造能在其他星球使用的先进机器。
automation-feron=极其快速的强大组装机，使用康神能量作为动力源。
biochamber-mk2=生物室的升级版本，使用富营养水而非营养素作为动力源。
artificial-global-gleba-soil=生命胶囊只能在康神星上使用，但土壤本身可以放置于任何位置，从而允许我们在所有表面培育康神品种的植物。换言之，我们能在任何地方产出碳、铁、铜、富营养水。
carnal-energy-crystal=康神能量的实体形态，可以大批量运输到其他星球。也可通过种植获得。
feron-airpump=极为先进的钼气泵变种。这台杰出的机器能从许多星球的大气中分离出特定粒子，制得我们需要的气体资源。
forging-exotic-material=培养奇异葵的复杂流程。奇异葵是种谜一般的植物，能产出可用的奇异物质。向高层大气发射火箭，即可收集康神星电磁场的气体，将普通的种子转化为奇异葵种子。
breeding-exoticia=能产出奇异物质的植物。
advanced-materialization=花费知识，令更复杂的资源实体化。
carna-reach-equipment=将你的触及范围扩展1地格。
carna-craft-equipment=增加你的手动制作速度。
carna-cache-equipment=拓展你的背包空间。
carnan-spire=庞大的结构，能将它接收到的能量发送给整颗星球！这台宏伟的机器能将所有种类的能量高效分配至整个表面，但需消耗巨量能量，且需要一枚尖塔核心。它能完全替代近程供电网络，不过要是核心被耗尽，能量输送也将停止。建议为尖塔运作所需的机器配备近程电网，以免传输中止。尖塔的运作需要巨量能量。
stingfrond-carnabreed=钩叶棘藓是制造其他康神植物的必需品。它的果实富含油脂。
algite-bio-dome=这座特种穹顶能复现出句芒星的环境，以便在其他星球种植玉玛果和果冻果。穹顶放置后会给出相应环境选项；环境落成之后无法逆转，穹顶也无法拆除。
# aps
carna-aps-a=当地的资源和残破机甲可回收得到残骸。这种残骸又可在谜一般的康神原生组装机中熔化为某种复制凝胶，以制造可直接使用的基础资源。
carna-aps-c=用钼在研究中心外部搭建框架，可为研究中心保温，让它们满速运转。
carna-aps-d=化工厂是专长于处理多种液体和气体的建筑。

