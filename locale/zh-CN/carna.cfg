[mod-setting-description]
carna-sciencesphere-mode=此模式会完全改变康神星的流程，换为使用科技球！在此模式下，大部分科技需要在康神星上使用科技球研究。警告：这会大幅拉长康神星的流程，至少拉长3倍。
carna-itemtemp=部分物品会具有所谓“变质物”，或者说，会逐渐由热变冷。部分配方需使用加热后的物品。会大幅增加康神星的物流难度。默认启用。此选项的引入是因为康神星本身的物流已经较为复杂，温度设定可能会导致难度体感过大。
carna-complex-atmosphere=若启用，康神星的大气会对机器产生复杂效应。热量污染较低时，机器的运作速度会降低40%；热量污染稍多些时，降低20%，最终变为满速运转；热量污染较高时，则会加快10%。此变化以区块为单位。若禁用，机器只会在污染不足的区块内减速20%。启用时可能会对UPS产生影响，但未经过详尽测试。建议开始游玩后或创建康神星表面后不要再改动此选项。
carna-atmosphere-check=康神星每隔多少秒检查各区块并更新温度效应。此检查的间隔时间固定。此选项值较高时，康神星上机器的状态更新速度较慢；较低时更新较快。
carna-atmosphere=简单：康神星大气对机器产生简单效应。机器未被供热塔加热时运作速度会下降。\n复杂：康神星大气对机器产生复杂效应。热量污染较低时，机器的运作速度会降低40%；热量污染稍多些时，降低20%，最终变为满速运转；热量污染较高时，则会加快10%。此变化以区块为单位。若禁用，机器只会在污染不足的区块内减速20%。\n复杂（优化）：和复杂表现一致，但不再按1x1区块检查，而是将2x2的区块归为一组进行检查。相应地，更新的精度会下降，但因为建筑面积过大而产生微量卡顿的概率将下降。\n复杂模式可能会对UPS产生影响，但未经过详尽测试。强烈建议开始游玩后或创建康神星表面后不要再改动此选项。
carna-roamers-temp=未在计刻时，康神星上游荡的机器人不会自行消失。它们显然有可能降低UPS。默认设置下，它们会自行死亡。若你觉得这些机器人还不错，也不太在意UPS下降，可选择保留它们。

