carnaEMF=康神星电磁场

[space-location-description]
carna=康神星（Carna）：温度极低的星球。其周围活跃的电磁场偶会在星球表面产生闪电，也让星球表面永远处于黑暗之中。对于我们的大多数机器而言，寒冷的大气会让它们无法全速运转，是个不小的阻碍。电磁场本身似乎并非天然形成，或许意味着这片荒凉的雪地中曾有过生命。扫描显示星球表面上散落着许多休眠的机器，星球的核心也像是已被人造物替换。

