rigor-module-disable-rigor-effect=[img=utility/warning_icon][font=default-bold]警告[/font][img=utility/warning_icon] 知道自己在做什么再启用！\n只有在移除本模组、或修改会导致实体消失的配置时，才应使用此设置转换存档。

