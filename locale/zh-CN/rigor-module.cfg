rigor-module-mod-tip-2=精密概率

[tips-and-tricks-item-description]
rigor-module-list=[item=rigor-module] 精密插件 \n[item=rigor-module-2] 精密插件 2 \n[item=rigor-module-3] 精密插件 3
rigor-module-mod-tip-1=精密是一种全新的插件效果，由[tooltip=精密插件,tips-and-tricks-item-description.rigor-module-list]提供。精密插件会提升配方产出其最有价值产品的发生比。精密只会影响存在概率产品的配方，且每个配方只能影响单个产品。精密也对回收配方无效，[recipe=scrap-recycling]除外。
rigor-module-mod-tip-2=精密能提升配方产出特定产品这一事件的发生比。\n对于概率“p”，发生比 = “p/(1-p)”。\n对于概率“p”和精密“r”，概率按此公式变化：“rp/(rp - p + 1)”。

