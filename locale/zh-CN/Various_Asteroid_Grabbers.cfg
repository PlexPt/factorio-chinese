[mod-name]
Various_Asteroid_Grabbers=多种星岩抓取臂 [Various Asteroid Grabbers]

[mod-description]
Various_Asteroid_Grabbers=新增了两种星岩抓取臂，各有专长均且与原版内容配合良好！

[item-name]
eel-asteroid-collector=鳗式星岩抓取臂
octopus-asteroid-collector=蛸式星岩抓取臂
[item-description]
eel-asteroid-collector=用于捕获小块星岩。与普通的星岩抓取臂相比范围明显较大，但运作速度明显较慢。品质可增加抓取数量、抓取范围和抓取速度。
octopus-asteroid-collector=用于捕获小块星岩。与普通的星岩抓取臂相比范围较小，但拥有八条抓取臂。品质可增加抓取范围和速度。
[entity-name]
eel-asteroid-collector=鳗式星岩抓取臂
octopus-asteroid-collector=蛸式星岩抓取臂
[entity-description]
eel-asteroid-collector=用于捕获小块星岩。与普通的星岩抓取臂相比范围明显较大，但运作速度明显较慢。品质可增加抓取数量、抓取范围和抓取速度。
octopus-asteroid-collector=用于捕获小块星岩。与普通的星岩抓取臂相比范围较小，但拥有八条抓取臂。品质可增加抓取范围和速度。
[recipe-name]
eel-asteroid-collector=抓取臂延长
octopus-asteroid-collector=抓取臂增量
[technology-name]
various-asteroid-grabbers=特种星岩抓取臂
[technology-description]
various-asteroid-grabbers=解锁特种星岩抓取臂，适用于在轨平台，也适用于处理高密度星岩冲击。
[string-mod-setting]
[mod-setting-name]
eel-colour=鳗式抓取臂配色
octopus-colour=蛸式抓取臂配色
[mod-setting-description]
eel-colour=选择鳗式星岩抓取臂的配色。需要重启游戏。
octopus-colour=选择蛸式星岩抓取臂的配色。需要重启游戏。